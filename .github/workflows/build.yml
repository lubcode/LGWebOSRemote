name: Build LG WebOS Remote APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LGWebOSRemote-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Get project ZIP
        uses: actions/checkout@v4

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f LGWebOSRemote-source.zip
          unzip -q LGWebOSRemote-source.zip -d extracted
          test -f extracted/LGWebOSRemote/settings.gradle
          test -f extracted/LGWebOSRemote/app/build.gradle

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already have Android SDK installed.
      # Avoid android-actions/setup-android, which failed during sdkmanager setup.
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          ls -la "$SDK/platforms" || true
          ls -la "$SDK/build-tools" || true

      - name: Ensure Android 35 tools are available
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            fi
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace -p extracted/LGWebOSRemote :app:assembleDebug

      - name: Publish APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LGWebOSRemote-debug-apk
          path: extracted/LGWebOSRemote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
